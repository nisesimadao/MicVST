name: release v1.3.0

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/release-v1.3.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build app and tests
        run: cmake --build build --config Release --target MicVST MicVSTTests

      - name: Run unit tests
        run: ./build/MicVSTTests_artefacts/Release/MicVSTTests.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: ./installer/build-installer.ps1

      - name: Prepare release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build/MicVST_artefacts/Release/MicVST.exe release/MicVST-portable.exe
          Copy-Item installer/out/MicVST-Setup-1.3.0.exe release/MicVST-Setup-1.3.0.exe

          $assets = @(
            'release/MicVST-portable.exe',
            'release/MicVST-Setup-1.3.0.exe'
          )
          $lines = foreach ($asset in $assets) {
            $hash = Get-FileHash $asset -Algorithm SHA256
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

          @'
          MicVST v1.3.0

          New: configurable Output2 monitoring.

          Routing:
          - Output remains automatically fixed to CABLE Input for the virtual microphone.
          - Output2 is optional and can be set to headphones, speakers, an audio interface, or another Windows playback device.
          - Output2 receives the same post-DSP/post-VST signal that is sent to VB-CABLE.
          - Set Output2 to Off when local monitoring is not needed.

          Output2 implementation:
          - Independent second WASAPI AudioDeviceManager.
          - Lock-free producer/consumer monitor buffer so a slow monitor device does not block the virtual mic path.
          - Small safety buffer for stable cross-device monitoring.
          - Lightweight resampling and adaptive clock correction when Output and Output2 use different sample rates or hardware clocks.
          - Saved Output2 selection is restored on startup.

          Existing v1.2.0 built-in DSP suite remains included:
          - AutoTune, Pitch Shift, Deep Voice
          - Robot, Radio / Walkie-Talkie, Bitcrusher
          - Wah / Auto Wah, Unison, Chorus, Delay, Reverb

          Downloads:
          - MicVST-Setup-1.3.0.exe - recommended. Installs the official signed base VB-CABLE backend when missing and offers Windows tray autostart.
          - MicVST-portable.exe - use this when VB-CABLE is already installed or when you prefer a portable executable.

          Notes:
          - Discord / OBS / Zoom / games should continue to use CABLE Output as the microphone.
          - Output2 is for local monitoring and is Off by default.
          - Using speakers close to the physical microphone can cause acoustic feedback.
          - VoiceMeeter is not required.
          - Secure Boot can remain enabled because the normal virtual-mic backend is the official signed VB-CABLE driver.
          '@ | Set-Content release-notes.txt -Encoding ascii

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmd /c "gh release view v1.3.0 -R %GITHUB_REPOSITORY% >nul 2>nul"
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.3.0 -R $env:GITHUB_REPOSITORY `
              release/MicVST-Setup-1.3.0.exe `
              release/MicVST-portable.exe `
              release/SHA256SUMS.txt `
              --clobber
            gh release edit v1.3.0 -R $env:GITHUB_REPOSITORY --notes-file release-notes.txt
          } else {
            gh release create v1.3.0 -R $env:GITHUB_REPOSITORY `
              release/MicVST-Setup-1.3.0.exe `
              release/MicVST-portable.exe `
              release/SHA256SUMS.txt `
              --target $env:GITHUB_SHA `
              --title 'MicVST v1.3.0' `
              --notes-file release-notes.txt
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
