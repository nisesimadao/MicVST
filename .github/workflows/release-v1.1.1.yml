name: release v1.1.1

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/release-v1.1.1.yml"

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Download verified main build artifacts
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release/setup | Out-Null
          New-Item -ItemType Directory -Force release/portable | Out-Null

          # Main build 33506816883 already passed MSVC build, unit tests and Inno Setup
          # for commit 8a8c27d, which contains the autostart checkbox.
          gh run download 33506816883 -R $env:GITHUB_REPOSITORY -n MicVST-Setup -D release/setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh run download 33506816883 -R $env:GITHUB_REPOSITORY -n MicVST-portable -D release/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = Get-ChildItem release/setup -Recurse -Filter 'MicVST-Setup-*.exe' | Select-Object -First 1
          $portable = Get-ChildItem release/portable -Recurse -Filter 'MicVST.exe' | Select-Object -First 1
          if (-not $setup -or -not $portable) { throw 'Expected release executables were not found in build artifacts.' }

          Copy-Item $setup.FullName release/MicVST-Setup-1.1.1.exe -Force
          Copy-Item $portable.FullName release/MicVST-portable.exe -Force

          $assets = @(
            'release/MicVST-portable.exe',
            'release/MicVST-Setup-1.1.1.exe'
          )
          $lines = foreach ($asset in $assets) {
            $hash = Get-FileHash $asset -Algorithm SHA256
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

          @'
          MicVST v1.1.1

          Built-in voice effects + signed virtual microphone backend.

          Downloads:
          - MicVST-Setup-1.1.1.exe — recommended one-click installer. Installs the official signed base VB-CABLE backend when it is missing, and includes an optional "Start MicVST with Windows (minimized to the system tray)" checkbox.
          - MicVST-portable.exe — use this if VB-CABLE is already installed, or if you prefer a portable executable.

          Virtual microphone routing:
          Physical Mic -> MicVST effects/VST3 -> CABLE Input -> CABLE Output -> Discord/OBS/Zoom/games

          Built-in effects:
          - AutoTune
          - Robot
          - Radio / Walkie-Talkie
          - Bitcrusher
          - Pitch Shift
          - Deep Voice

          Tray behavior:
          - Closing the main window keeps MicVST running in the system tray.
          - Click the tray icon to show/hide the window.
          - Right-click the tray icon for startup and Quit options.
          - Windows autostart uses --tray, so it starts silently in the tray.

          VB-CABLE is third-party donationware by VB-Audio Software and remains under VB-Audio's own terms.
          '@ | Set-Content release-notes.txt -Encoding utf8

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmd /c "gh release view v1.1.1 -R %GITHUB_REPOSITORY% >nul 2>nul"
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.1 -R $env:GITHUB_REPOSITORY `
              release/MicVST-Setup-1.1.1.exe `
              release/MicVST-portable.exe `
              release/SHA256SUMS.txt `
              --clobber
          } else {
            gh release create v1.1.1 -R $env:GITHUB_REPOSITORY `
              release/MicVST-Setup-1.1.1.exe `
              release/MicVST-portable.exe `
              release/SHA256SUMS.txt `
              --target 8a8c27d390b2c2e8436bc4255e177dc105bc9d49 `
              --title 'MicVST v1.1.1' `
              --notes-file release-notes.txt
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
