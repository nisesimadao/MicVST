name: release v1.1.1

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/release-v1.1.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target MicVST MicVSTTests

      - name: Test
        run: ./build/MicVSTTests_artefacts/Release/MicVSTTests.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: ./installer/build-installer.ps1

      - name: Prepare release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build/MicVST_artefacts/Release/MicVST.exe release/MicVST-portable.exe
          Copy-Item installer/out/MicVST-Setup-1.1.1.exe release/MicVST-Setup-1.1.1.exe

          $assets = @(
            'release/MicVST-portable.exe',
            'release/MicVST-Setup-1.1.1.exe'
          )
          $lines = foreach ($asset in $assets) {
            $hash = Get-FileHash $asset -Algorithm SHA256
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

          @'
          MicVST v1.1.1

          Built-in voice effects + signed virtual microphone backend.

          Downloads:
          - MicVST-Setup-1.1.1.exe — recommended one-click installer. Installs the official signed base VB-CABLE backend when it is missing, and offers an optional "Start MicVST with Windows" checkbox.
          - MicVST-portable.exe — use this if VB-CABLE is already installed, or if you prefer a portable executable.

          Virtual microphone routing:
          Physical Mic -> MicVST effects/VST3 -> CABLE Input -> CABLE Output -> Discord/OBS/Zoom/games

          Built-in effects:
          - AutoTune
          - Robot
          - Radio / Walkie-Talkie
          - Bitcrusher
          - Pitch Shift
          - Deep Voice

          Tray behavior:
          - Closing the main window keeps MicVST running in the system tray.
          - Click the tray icon to show/hide the window.
          - Right-click the tray icon for startup and Quit options.
          - Windows autostart uses --tray, so it starts silently in the tray.

          VB-CABLE is third-party donationware by VB-Audio Software and remains under VB-Audio's own terms.
          '@ | Set-Content release-notes.txt -Encoding utf8

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'release/MicVST-Setup-1.1.1.exe',
            'release/MicVST-portable.exe',
            'release/SHA256SUMS.txt'
          )

          gh release view v1.1.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.1 @assets --clobber
          } else {
            gh release create v1.1.1 @assets --target $env:GITHUB_SHA --title 'MicVST v1.1.1' --notes-file release-notes.txt
          }
