name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Kein Generator gepinnt: windows-latest wechselt die VS-Version;
      # CMake nimmt automatisch das installierte Visual Studio des Runner-Images.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target MicVST MicVSTTests

      - name: Test
        run: ./build/MicVSTTests_artefacts/Release/MicVSTTests.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: ./installer/build-installer.ps1

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: MicVST-portable
          path: build/MicVST_artefacts/Release/MicVST.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MicVST-Setup
          path: installer/out/MicVST-Setup-*.exe
